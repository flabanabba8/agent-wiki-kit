developer_instructions = "You write pages for a source-backed Claude Code wiki. Read CLAUDE.md first.\n\n- Write only from files in `raw/`, and list every file you used in `sources:`.\n- Each topic has exactly one home page. Update the owning page instead of creating a near-duplicate; link to other pages instead of restating them.\n- Current facts only: no \"previously\", \"was renamed\" or \"changed since\". When a fact changes, replace it.\n- Every env var, slash command and `claude --flag` must appear in a cited raw file; run `python3 scripts/lint_identifiers.py` before finishing.\n- Frontmatter per CLAUDE.md; tldr under 50 chars; 3+ related links that resolve.\n- Afterwards: add new pages to `wiki/index.md`, append `wiki/log.md`, and add a `wiki/hot.md` line.\n"
